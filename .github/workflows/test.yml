name: Test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Gameplay and import regressions
        run: |
          npm run dev > /tmp/midi-stage-dev.log 2>&1 &
          ready=false
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8082/ > /dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            cat /tmp/midi-stage-dev.log
            echo "Development server did not become ready on port 8082." >&2
            exit 1
          fi
          npm run test:session
          npm run test:practice
          npm run test:targeted-practice
          npm run test:navigation
          npm run test:rehearsal-bookmark
          npm run test:guitar
          npm run test:setup
          npm run test:imports
          npm run test:audio
          sudo mkdir -p /workspace/screenshots/illustrated-band
          sudo chown -R "$USER" /workspace/screenshots
          SESSION_SCREENSHOT_DIR=/workspace/screenshots/illustrated-band npm run test:graphics
          node scripts/browser-smoke.mjs http://127.0.0.1:8082/ /workspace/screenshots/illustrated-band/dev.png
          npm run preview:restart
          node scripts/browser-smoke.mjs http://127.0.0.1:8081/ /workspace/screenshots/illustrated-band/built.png --baseline /workspace/screenshots/illustrated-band/dev.json
      - name: Save browser acceptance captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: illustrated-band-browser-acceptance
          path: /workspace/screenshots/illustrated-band/
          if-no-files-found: warn

  drummer-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Capture drummer poses
        run: |
          sudo mkdir -p /workspace/screenshots/drummer-rig
          sudo chown -R "$USER" /workspace/screenshots
          npm run dev > /tmp/drummer-dev.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8082/ > /dev/null; then break; fi
            sleep 1
          done
          SESSION_SCREENSHOT_DIR=/workspace/screenshots/drummer-rig npm run test:graphics
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drummer-rig-poses
          path: /workspace/screenshots/drummer-rig/
          if-no-files-found: error
