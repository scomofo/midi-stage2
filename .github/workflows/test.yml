name: Test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  full-band-import:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify full-band review, audio audition and mixed-instrument playback
        run: |
          npm run dev > /tmp/full-band-import-dev.log 2>&1 &
          ready=false
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8082/ > /dev/null; then ready=true; break; fi
            sleep 1
          done
          if [ "$ready" != true ]; then cat /tmp/full-band-import-dev.log; exit 1; fi
          sudo mkdir -p /workspace/screenshots/full-band-import
          sudo chown -R "$USER" /workspace/screenshots
          SESSION_SCREENSHOT_DIR=/workspace/screenshots/full-band-import npm run test:full-band-import
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-band-stems-desktop
          path: /workspace/screenshots/full-band-import/
          if-no-files-found: error

  keyboard-import:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify keyboard audio drafts with the real model
        run: |
          npm run dev > /tmp/keyboard-import-dev.log 2>&1 &
          ready=false
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8082/ > /dev/null; then ready=true; break; fi
            sleep 1
          done
          if [ "$ready" != true ]; then cat /tmp/keyboard-import-dev.log; exit 1; fi
          sudo mkdir -p /workspace/screenshots/keyboard-import
          sudo chown -R "$USER" /workspace/screenshots
          SESSION_SCREENSHOT_DIR=/workspace/screenshots/keyboard-import npm run test:keyboard-import
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: keyboard-audio-drafts-desktop
          path: /workspace/screenshots/keyboard-import/
          if-no-files-found: error

  audio-drums:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify audio drum drafts
        run: |
          npm run dev > /tmp/audio-drums-dev.log 2>&1 &
          ready=false
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8082/ > /dev/null; then ready=true; break; fi
            sleep 1
          done
          if [ "$ready" != true ]; then cat /tmp/audio-drums-dev.log; exit 1; fi
          sudo mkdir -p /workspace/screenshots/audio-drums
          sudo chown -R "$USER" /workspace/screenshots
          SESSION_SCREENSHOT_DIR=/workspace/screenshots/audio-drums npm run test:audio-drums
          SESSION_SCREENSHOT_DIR=/workspace/screenshots/audio-drums npm run test:drum-stems
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audio-drum-drafts-desktop
          path: /workspace/screenshots/audio-drums/
          if-no-files-found: error

  performance-hud:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify performance controls
        run: |
          npm run dev > /tmp/performance-hud-dev.log 2>&1 &
          ready=false
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8082/ > /dev/null; then ready=true; break; fi
            sleep 1
          done
          if [ "$ready" != true ]; then cat /tmp/performance-hud-dev.log; exit 1; fi
          sudo mkdir -p /workspace/screenshots/performance-hud
          sudo chown -R "$USER" /workspace/screenshots
          SESSION_SCREENSHOT_DIR=/workspace/screenshots/performance-hud npm run test:performance-hud
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-hud-browser-acceptance
          path: /workspace/screenshots/performance-hud/
          if-no-files-found: error

  guitar-import:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify authored guitar import
        run: |
          npm run dev > /tmp/guitar-import-dev.log 2>&1 &
          ready=false
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8082/ > /dev/null; then ready=true; break; fi
            sleep 1
          done
          if [ "$ready" != true ]; then cat /tmp/guitar-import-dev.log; exit 1; fi
          sudo mkdir -p /workspace/screenshots/guitar-import
          sudo chown -R "$USER" /workspace/screenshots
          SESSION_SCREENSHOT_DIR=/workspace/screenshots/guitar-import npm run test:guitar-import
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: authored-guitar-import-desktop
          path: /workspace/screenshots/guitar-import/
          if-no-files-found: error

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Gameplay and import regressions
        run: |
          npm run dev > /tmp/midi-stage-dev.log 2>&1 &
          ready=false
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8082/ > /dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            cat /tmp/midi-stage-dev.log
            echo "Development server did not become ready on port 8082." >&2
            exit 1
          fi
          npm run test:session
          npm run test:practice
          npm run test:targeted-practice
          npm run test:navigation
          npm run test:rehearsal-bookmark
          npm run test:guitar
          npm run test:setup
          npm run test:imports
          npm run test:audio
          sudo mkdir -p /workspace/screenshots/illustrated-band
          sudo chown -R "$USER" /workspace/screenshots
          SESSION_SCREENSHOT_DIR=/workspace/screenshots/illustrated-band npm run test:graphics
          node scripts/browser-smoke.mjs http://127.0.0.1:8082/ /workspace/screenshots/illustrated-band/dev.png
          npm run preview:restart
          node scripts/browser-smoke.mjs http://127.0.0.1:8081/ /workspace/screenshots/illustrated-band/built.png --baseline /workspace/screenshots/illustrated-band/dev.json
      - name: Save browser acceptance captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: illustrated-band-browser-acceptance
          path: /workspace/screenshots/illustrated-band/
          if-no-files-found: warn
